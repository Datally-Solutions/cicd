name: Reusable Terraform Workflow

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Path to Terraform root"
        required: true
        type: string
      state_prefix:
        description: "GCS state prefix (e.g. infra, backend)"
        required: true
        type: string
      environment:
        description: "Deployment environment"
        required: false
        type: string
        default: "production"
      has_tfvars:
        description: "Whether to write TF_VARS secret to terraform.tfvars"
        required: false
        type: string
        default: "true"
      firmware_check_token_sm_secret:
        description: "SM secret name for TF_VAR_firmware_check_token (leave empty if not required)"
        required: false
        type: string
        default: ""
      provisioning_token_sm_secret:
        description: "SM secret name for TF_VAR_provisioning_token (leave empty if not required)"
        required: false
        type: string
        default: ""
      extra_vars:
        description: "Extra -var flags passed to terraform plan (space-separated, non-sensitive only)"
        required: false
        type: string
        default: ""
      terraform_version:
        description: "Terraform version to install"
        required: false
        type: string
        default: "1.10.3"
    secrets:
      TF_VARS:
        required: false

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform ${{ inputs.state_prefix }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    # -------------------------------------------------------
    # GCP config — non-sensitive values, hardcoded here.
    # Security comes from WIF + IAM, not the confidentiality of these strings.
    # -------------------------------------------------------
    env:
      GCP_REGION:     "europe-west9"
      TFSTATE_BUCKET: "cat-litter-monitor-tfstate"
      ALERT_EMAIL:    "leqsiouer.mehdi@outlook.com"

    steps:
      - name: Checkout calling repo
        uses: actions/checkout@v4

      # PR runs (github.event_name == 'pull_request') get a read-only identity that can
      # compute a plan but cannot create/update/delete anything — see infra/iam.tf
      # (terraform_plan_sa / github-pool-readonly) for why this has to be a fully separate
      # WIF pool, not just a less-restrictive provider next to the privileged one.
      - name: Authenticate to GCP
        id: gcp
        uses: Datally-Solutions/cicd/.github/actions/gcp-auth@main
        with:
          # A step's `with:` can't conditionally omit a key, and passing an empty string
          # would override the action's own default rather than falling back to it — so
          # both branches are spelled out explicitly here, not just the read-only one.
          workload_identity_provider: ${{ github.event_name == 'pull_request' && 'projects/853335570767/locations/global/workloadIdentityPools/github-pool-readonly/providers/github-provider-readonly' || 'projects/853335570767/locations/global/workloadIdentityPools/github-pool/providers/github-provider' }}
          service_account: ${{ github.event_name == 'pull_request' && 'terraform-plan-sa@cat-litter-monitor.iam.gserviceaccount.com' || 'terraform-cicd-sa@cat-litter-monitor.iam.gserviceaccount.com' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Write tfvars
        if: inputs.has_tfvars == 'true'
        working-directory: ${{ inputs.working_directory }}
        env:
          TF_VARS_CONTENT: ${{ secrets.TF_VARS }}
        run: printf '%s\n' "$TF_VARS_CONTENT" > terraform.tfvars

      - name: Fetch firmware_check_token from Secret Manager
        if: inputs.firmware_check_token_sm_secret != ''
        id: sm_firmware
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |
            firmware_check_token:${{ steps.gcp.outputs.project_id }}/${{ inputs.firmware_check_token_sm_secret }}

      - name: Export firmware_check_token as TF var
        if: inputs.firmware_check_token_sm_secret != '' && steps.sm_firmware.outputs.firmware_check_token != ''
        env:
          _val: ${{ steps.sm_firmware.outputs.firmware_check_token }}
        run: |
          echo "::add-mask::$_val"
          {
            echo "TF_VAR_firmware_check_token<<EOF_FIRMWARE_CHECK_TOKEN"
            echo "$_val"
            echo "EOF_FIRMWARE_CHECK_TOKEN"
          } >> "$GITHUB_ENV"

      - name: Fetch provisioning_token from Secret Manager
        if: inputs.provisioning_token_sm_secret != ''
        id: sm_provisioning
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |
            provisioning_token:${{ steps.gcp.outputs.project_id }}/${{ inputs.provisioning_token_sm_secret }}

      - name: Export provisioning_token as TF var
        if: inputs.provisioning_token_sm_secret != '' && steps.sm_provisioning.outputs.provisioning_token != ''
        env:
          _val: ${{ steps.sm_provisioning.outputs.provisioning_token }}
        run: |
          echo "::add-mask::$_val"
          {
            echo "TF_VAR_provisioning_token<<EOF_PROVISIONING_TOKEN"
            echo "$_val"
            echo "EOF_PROVISIONING_TOKEN"
          } >> "$GITHUB_ENV"

      - name: Terraform Init
        working-directory: ${{ inputs.working_directory }}
        env:
          STATE_PREFIX: ${{ inputs.state_prefix }}
          TF_VAR_GCP_PROJECT_ID: ${{ steps.gcp.outputs.project_id }}
          TF_VAR_GCP_REGION: ${{ env.GCP_REGION }}
        run: |
          terraform init \
            -backend-config="bucket=$TFSTATE_BUCKET" \
            -backend-config="prefix=$STATE_PREFIX"

      - name: Terraform Format Check
        id: fmt
        working-directory: ${{ inputs.working_directory }}
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Validate
        id: validate
        working-directory: ${{ inputs.working_directory }}
        run: terraform validate
        continue-on-error: true

      - name: Terraform Plan
        id: plan
        working-directory: ${{ inputs.working_directory }}
        env:
          TF_VAR_GCP_PROJECT_ID: ${{ steps.gcp.outputs.project_id }}
          TF_VAR_GCP_REGION: ${{ env.GCP_REGION }}
          TF_VAR_alert_email: ${{ env.ALERT_EMAIL }}
          EXTRA_VARS: ${{ inputs.extra_vars }}
        run: |
          set -o pipefail
          extra_args=()
          if [[ -n "$EXTRA_VARS" ]]; then
            read -ra extra_args <<< "$EXTRA_VARS"
          fi
          # PR runs use the read-only plan SA, which deliberately can't write the GCS state
          # lock object (storage.objects.create) — and doesn't need to: a PR plan makes no
          # state changes, so there's nothing concurrent writers need protecting from here.
          lock_arg="-lock=true"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            lock_arg="-lock=false"
          fi
          terraform plan \
            -input=false \
            -out=tfplan \
            -no-color \
            "$lock_arg" \
            "${extra_args[@]}" \
            2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Post Plan as PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_WORKING_DIRECTORY: ${{ inputs.working_directory }}
          STATE_PREFIX: ${{ inputs.state_prefix }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const planPath = path.join(process.env.PLAN_WORKING_DIRECTORY, 'plan_output.txt');
            const plan = fs.readFileSync(planPath, 'utf8');
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '\n... (truncated)' : plan;
            const icon = (outcome) => outcome === 'success' ? '✅' : outcome === 'failure' ? '❌' : '⚠️';
            const body = `## Terraform Plan — \`${process.env.STATE_PREFIX}\`

            | Step | Result |
            |------|--------|
            | Format | ${icon('${{ steps.fmt.outcome }}')} \`${{ steps.fmt.outcome }}\` |
            | Validate | ${icon('${{ steps.validate.outcome }}')} \`${{ steps.validate.outcome }}\` |
            | Plan | ${icon('${{ steps.plan.outcome }}')} \`${{ steps.plan.outcome }}\` |

            <details><summary>Plan output</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`
            </details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Fail if fmt, validate, or plan failed
        if: steps.fmt.outcome == 'failure' || steps.validate.outcome == 'failure' || steps.plan.outcome == 'failure'
        run: exit 1

      - name: Upload plan artifact
        if: github.ref == 'refs/heads/main' && steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.state_prefix }}
          path: ${{ inputs.working_directory }}/tfplan
          retention-days: 1

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: ${{ inputs.working_directory }}
        env:
          TF_VAR_GCP_PROJECT_ID: ${{ steps.gcp.outputs.project_id }}
          TF_VAR_GCP_REGION: ${{ env.GCP_REGION }}
          TF_VAR_alert_email: ${{ env.ALERT_EMAIL }}
        run: terraform apply -auto-approve tfplan

      - name: Cleanup tfvars
        if: always() && inputs.has_tfvars == 'true'
        working-directory: ${{ inputs.working_directory }}
        run: rm -f terraform.tfvars
