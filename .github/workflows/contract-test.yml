name: Contract test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run reusable Terraform contract test
        run: python3 -m unittest tests/test_reusable_terraform_contract.py -v
